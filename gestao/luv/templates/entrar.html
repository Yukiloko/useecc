<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{ empresa }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .entrar { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .entrar .card { width: min(380px, 100%); padding: 36px 32px; text-align: center; }
    .entrar .marca-logo { width: 56px; height: 56px; border-radius: 16px; font-size: 17px; margin: 0 auto 18px; }
    .entrar h1 { font-size: 24px; }
    .entrar form { text-align: left; margin-top: 26px; }
  </style>
</head>
<body>
  <main class="entrar">
    <div class="card">
      <span class="marca-logo">LUV</span>
      <h1>{{ empresa }}</h1>
      <p class="muted" style="margin-top:6px">Gestão</p>
      <form method="post" class="form">
        <input type="hidden" name="proximo" value="{{ proximo }}">
        <label class="campo"><span>Senha</span><input type="password" name="senha" autofocus required autocomplete="current-password"></label>
        {% if erro %}<div class="alerta">{{ erro }}</div>{% endif %}
        <label class="check"><input type="checkbox" name="lembrar" value="1" checked> Manter conectado neste aparelho</label>
        <button class="btn" style="width:100%;height:42px">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
