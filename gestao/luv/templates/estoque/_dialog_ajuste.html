<dialog id="dlg-ajuste">
  <form method="post" class="form">
    <div>
      <h2 data-campo="nome">Ajustar estoque</h2>
      <p class="sub">Saldo atual: <span data-campo="atual"></span></p>
    </div>
    <div class="seg" id="ajuste-seg" style="width:max-content">
      <button type="button" class="on" data-tipo="perda">Perda</button>
      <button type="button" data-tipo="contagem">Contagem</button>
      <button type="button" data-tipo="entrada">Entrada</button>
    </div>
    <input type="hidden" name="tipo" value="perda" id="ajuste-tipo">
    <label class="campo"><span id="ajuste-rot">Quantidade perdida</span>
      <div class="sufixo"><input name="quantidade" class="num" inputmode="decimal" required><i data-campo="unidade">g</i></div>
      <span class="dica" id="ajuste-dica">Perdas entram como custo na DRE, pelo custo médio.</span>
    </label>
    <div class="campos">
      <label class="campo"><span>Data</span><input type="date" name="data" value="{{ hoje_iso }}"></label>
      <label class="campo"><span>Motivo</span><input name="observacao" placeholder="Ex.: quebrou na entrega"></label>
    </div>
    <div class="rodape-form">
      <button type="button" class="btn sec" data-fechar>Cancelar</button>
      <button class="btn">Salvar</button>
    </div>
  </form>
</dialog>
<script>
(() => {
  const seg = document.getElementById('ajuste-seg');
  const textos = {
    perda: ['Quantidade perdida', 'Perdas entram como custo na DRE, pelo custo médio.'],
    contagem: ['Quantidade contada', 'O saldo passa a ser o que você contou. A diferença vira ajuste de estoque.'],
    entrada: ['Quantidade', 'Entrada sem compra (doação, sobra). Usa o custo médio atual.'],
  };
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('ajuste-tipo').value = b.dataset.tipo;
    document.getElementById('ajuste-rot').textContent = textos[b.dataset.tipo][0];
    document.getElementById('ajuste-dica').textContent = textos[b.dataset.tipo][1];
  });
})();
</script>
